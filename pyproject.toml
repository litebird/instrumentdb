[project]
name = "instrumentdb"
version = "3.1.0"
description = ""
authors = [{ name = "Maurizio Tomasi", email = "ziotom78@gmail.com" }]
requires-python = ">=3.10,<4"
dependencies = [
    "django>=4.2.29,<5",
    "markdown>=3.2.1,<4",
    "pygments>=2.20.0,<3",
    "djangorestframework>=3.15.2,<4",
    "django-filter>=2.2.0,<3",
    "pyyaml>=6.0.0,<7",
    "django-mptt>=0.14.0,<0.15",
    "drf-yasg>=1.21.7,<2",
    "gitpython>=3.1.41,<4",
    "envparse>=0.2.0,<0.3",
    "sphinx>=8.0.4,<9",
    "django-sslserver>=0.22,<0.23",
    "Pillow>=12.1.1,<13",
    "pytz>=2025.2,<2026",
    "coverage>=7.2.7,<8",
    "flake8>=7.3.0,<8",
    "black>=26.3.1,<27",
    "django-cleanup>=8.0.0,<9",
    "django-active-link>=0.1.8,<0.2",
    "django-markdownify>=0.9.7,<0.10",
    "numpy<2.5",
]

[project.scripts]
manage = "manage:main"

[dependency-groups]
dev = [
    "pytest>=7.4,<8",
    "pytest-django>=4.5,<5",
]

[build-system]
requires = ["poetry>=1.3.1"]
build-backend = "poetry.masonry.api"
