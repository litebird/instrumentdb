
[project]
name = "instrumentdb"
version = "3.1.0"
description = ""
authors = [{ name = "Maurizio Tomasi", email = "ziotom78@gmail.com" }]
requires-python = ">=3.12,<3.15"

dependencies = [
    "django>=5.2,<6",
    "markdown>=3.2.1,<5",
    "pygments>=2.20.0,<4",
    "djangorestframework>=3.15.2,<4",
    "django-filter>=2.2.0,<4",
    "pyyaml>=6.0.0,<8",
    "django-mptt>=0.14.0,<1",
    "drf-yasg>=1.21.7,<2",
    "gitpython>=3.1.41,<5",
    "envparse>=0.2.0,<1",
    "sphinx>=8.0.4,<10",
    "django-sslserver>=0.22,<1",
    "Pillow>=12.1.1,<14",
    "pytz>=2025.2,<2027",
    "coverage>=7.2.7,<9",
    "flake8>=7.3.0,<9",
    "Flake8-pyproject>=1.2.4,<2",
    "black>=26.3.1,<28",
    "django-cleanup>=8.0.0,<10",
    "django-active-link>=0.1.8,<1",
    "django-markdownify>=0.9.7,<1",
    "numpy>=2.5,<3",
    "whitenoise>=6.12.0",
    "django-allauth>=65.22.1",
]

[project.scripts]
manage = "manage:main"

[dependency-groups]
dev = [
    "pytest>=7.4,<8",
    "pytest-django>=4.5,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.flake8]
exclude = [
           ".venv",
           "browse/migrations"
	]
max-line-length = 119
