name: Tests

on: [push]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.14"]

    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v2

      - name: "Set up uv and Python"
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: "Install dependencies"
        run: uv sync --locked

      - name: "Check that the code is formatted using black"
        run: uv run black --check --diff .

      - name: "Run flake8"
        run: uv run python -m flake8

      - name: "Create a configuration file for Django"
        run: |
          export DB_PATH=$HOME/db
          mkdir -p "$DB_PATH"
          cp .env.example .env
          sed -i 's/SECRET_KEY=""/SECRET_KEY="deadmeat"/g' .env
          sed -i "s|LOG_FILE_PATH=.*|LOG_FILE_PATH=$DB_PATH/mylog.txt|g" .env
          sed -i "s|STORAGE_PATH=.*|STORAGE_PATH=$DB_PATH/storage|g" .env
          sed -i "s|DATABASE_URL=.*|DATABASE_URL=$DB_PATH/storage/instrumentdb.sqlite3|g" .env
          sed -i "s|STATIC_PATH=.*|STATIC_PATH=$DB_PATH/storage/static|g" .env

      - name: "Run tests"
        run: uv run python manage.py test
